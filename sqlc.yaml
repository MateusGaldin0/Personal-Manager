version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/database/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "store"
        sql_package: "pgx/v5"
        out: "internal/store"
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: "camel"
        overrides:
          # UUIDs use google/uuid for ergonomic JSON marshaling.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Money: NUMERIC ↔ shopspring/decimal. Never float64.
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type: "github.com/shopspring/decimal.NullDecimal"
          # Times use stdlib time.Time (not pgtype.Timestamptz).
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          # citext is an extension type sqlc doesn't ship a default for.
          - db_type: "citext"
            go_type: "string"
          # Nullable text → *string instead of pgtype.Text.
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
